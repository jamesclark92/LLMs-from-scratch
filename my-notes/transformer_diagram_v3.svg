  <rect width="1120" height="900" fill="#ffffff"/>

  <text x="40" y="34" font-size="21" font-weight="700" fill="#1a1a1a">The Transformer — Encoder / Decoder</text>
  <text x="40" y="54" font-size="13.5" fill="#57606a">Flow runs bottom → top. Numbers &amp; letters are explained in the companion notes (markdown).</text>

