x="350.0" y="431" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6570" font-weight="400">Each one-hot row's single 1 selects one row of W — so the whole sentence is one matmul.</text><text x="350.0" y="446" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6570" font-weight="400">The model never builds the one-hot rows; a table lookup gives the same result, far cheaper.</text></svg>