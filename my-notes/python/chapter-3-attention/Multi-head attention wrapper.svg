<text class="lab" x="56" y="670" fill="#3a6ea5">Key point</text>
<text class="ts" x="56" y="690">Batch (2) and token (6) axes never change. Only the feature axis grows:</text>
<text class="ts" x="56" y="708">each head adds its own d_out columns, so output width = num_heads × d_out.</text>
<text class="ts" x="56" y="726">Every token ends up as head0’s features followed by head1’s features.</text>
